name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (+ test count for docs)
        run: npm run test:ci

      - name: Lint (eslint, error-level gate)
        run: npm run lint

      - name: i18n key parity (en baseline)
        run: python3 scripts/i18n.py missing

      - name: i18n full audit (placeholders, menu lengths)
        run: python3 scripts/i18n.py verify

      - name: Package the extension zip
        run: python3 scripts/package.py

  # Real-browser gate: loads the extension and asserts zero page/console
  # errors. This is the ONLY gate that catches "the popup crashes on load" —
  # the vitest suites never import src/neat.js (the app shell), so an
  # init-time TDZ/ReferenceError slips past them (the v4.0.4 regression).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Real-browser smoke (zero console errors)
        run: scripts/harness/run.sh --smoke-only
