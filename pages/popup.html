<!DOCTYPE html>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/neat.css">
<link rel="stylesheet" href="/css/sync-styles.css">
<div id="container">
    <div id="clipboardcopier">
        <textarea id="copier-input" value=""></textarea>
    </div>
    <div id="search" role="search"><svg class="vbm-icon vbm-icon-search" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.7" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.3" y1="10.3" x2="13.6" y2="13.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="search-input" type="search" results="0" autofocus><button id="search-clear" type="button" tabindex="-1"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button id="quick-add-btn" type="button"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.7l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button><span id="quick-add-toast" role="status"></span></div>
    <div id="undo-toast" hidden><span id="undo-toast-text"></span><button id="undo-toast-button" type="button"></button></div>
      <div id="donation">
        <div id="donation-card">
            <svg id="donation-heart" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 14.4S1.6 10.5 1.6 6.2c0-2 1.6-3.6 3.5-3.6 1.1 0 2.2.6 2.9 1.5.7-.9 1.8-1.5 2.9-1.5 1.9 0 3.5 1.6 3.5 3.6 0 4.3-6.4 8.2-6.4 8.2z" fill="currentColor"/></svg>
            <div id="information-text">
                <p id="new-version-text"></p>
                <p id="donation-text"></p>
                <div id="donation-actions">
                    <button id="donation-go" type="button"></button>
                    <button id="donation-later" type="button"></button>
                    <button id="donation-never" type="button"></button>
                </div>
            </div>
        </div>
    </div>
    <div id="tree" tabindex="-1"></div>
    <div id="results" tabindex="-1"></div>
</div>
<div id="drop-overlay"></div>
<div id="bookmark-clone"></div>
<menu id="bookmark-context-menu" type="context" tabindex="-1">
    <div id="bookmark-new-tab" class="menu-item" tabindex="-1"></div>
    <div id="bookmark-new-window" class="menu-item" tabindex="-1"></div>
    <div id="bookmark-new-incognito-window" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep4">
    <div id="bookmark-edit" class="menu-item" tabindex="-1"></div>
    <div id="copy-title-and-url" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep5">
    <div id="add-bookmark-before-bookmark" class="menu-item" tabindex="-1"></div>
    <div id="add-bookmark-after-bookmark" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep1">
    <div id="add-folder-before-bookmark" class="menu-item" tabindex="-1"></div>
    <div id="add-folder-after-bookmark" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep2">
    <div id="add-separator" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep3">
    <div id="replace-url" class="menu-item" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep6">
    <div id="bookmark-delete" class="menu-item" tabindex="-1"></div>
</menu>
<menu id="folder-context-menu" type="context" tabindex="-1">
    <div id="folder-window" class="menu-item" tabindex="-1"></div>
    <div id="open-bookmarks-in-group" class="menu-item" tabindex="-1"></div>
    <div id="folder-new-window" class="menu-item" tabindex="-1"></div>
    <div id="folder-new-incognito-window" class="menu-item" tabindex="-1"></div>
    <hr id="folder-context-menu-sep1">
    <div id="folder-edit" class="menu-item" tabindex="-1"></div>
    <hr id="folder-context-menu-sep7">
    <div id="sort-folder-contents" class="menu-item" tabindex="-1"></div>
    <hr id="folder-context-menu-sep2">
    <div id="add-bookmark-top" class="menu-item" tabindex="-1"></div>
    <div id="add-bookmark-bottom" class="menu-item" tabindex="-1"></div>
    <div id="add-new-folder" class="menu-item" tabindex="-1"></div>
    <hr id="folder-context-menu-sep3">
    <div id="add-bookmark-before-folder" class="menu-item" tabindex="-1"></div>
    <div id="add-bookmark-after-folder" class="menu-item" tabindex="-1"></div>
    <div id="add-folder-before-folder" class="menu-item" tabindex="-1"></div>
    <div id="add-folder-after-folder" class="menu-item" tabindex="-1"></div>
    <div id="add-folder-separator" class="menu-item" tabindex="-1"></div>
    <hr id="folder-context-menu-sep4">
    <div id="folder-delete" class="menu-item" tabindex="-1"></div>
    <!--<hr>
	<command id="copy-all-titles-and-urls" tabindex="-1">-->
</menu>
<menu id="separator-context-menu" type="context" tabindex="-1">
    <div id="remove-separator" class="menu-item" tabindex="-1"></div>
</menu>
<div id="resizer-x" class="resizer"></div>
<div id="resizer-y" class="resizer"></div>
<div id="cover"></div>
<div id="command-palette" hidden><input id="palette-input" type="text"><ul id="palette-results"></ul></div>
<div id="alert-dialog" class="dialog" role="dialog">
    <p id="alert-dialog-text" class="dialog-text"></p>
</div>
<div id="confirm-dialog" class="dialog" role="dialog">
    <p id="confirm-dialog-text" class="dialog-text"></p>
    <div class="buttons">
        <button id="confirm-dialog-button-1"></button>
        <button id="confirm-dialog-button-2"></button>
    </div>
</div>
<div id="edit-dialog" class="dialog" role="dialog">
    <form id="edit-dialog-form">
        <p id="edit-dialog-text" class="dialog-text"></p>
        <input id="edit-dialog-name">
        <input type="url" id="edit-dialog-url" aria-required="true" required>
        <div class="buttons">
            <button id="edit-dialog-button" type="submit"></button>
            <button id="edit-dialog-cancel-button" type="button"></button>
        </div>
    </form>
</div>
<div id="new-folder-dialog" class="dialog" role="dialog">
    <form id="new-folder-dialog-form">
        <p id="new-folder-dialog-text" class="dialog-text"></p>
        <input id="new-folder-dialog-name">
        <div class="buttons">
            <button id="new-folder-dialog-button" type="submit"></button>
            <button id="new-folder-dialog-cancel-button" type="button"></button>
        </div>
    </form>
</div>
<div id="sort-dialog" class="dialog" role="dialog">
    <p id="sort-dialog-text" class="dialog-text"></p>
    <div id="sort-dialog-options">
        <label><input type="radio" name="sort-by" id="sort-by-title" value="title" checked> <span id="sort-by-title-label"></span></label>
        <label><input type="radio" name="sort-by" id="sort-by-date" value="dateAdded"> <span id="sort-by-date-label"></span></label>
        <label><input type="checkbox" id="sort-folders-first" checked> <span id="sort-folders-first-label"></span></label>
        <label><input type="checkbox" id="sort-recursive"> <span id="sort-recursive-label"></span></label>
        <p id="sort-recursive-warning" hidden></p>
    </div>
    <div class="buttons">
        <button id="sort-dialog-ok-button" type="button"></button>
        <button id="sort-dialog-cancel-button" type="button"></button>
    </div>
</div>
<script src="/src/store.js"></script>
<script src="/src/popup.js"></script>
<script src="/src/sync-manager.js"></script>
<script src="/src/fuzzy.js"></script>
<script src="/src/sort-utils.js"></script>
<script type="module" src="/src/neat.js"></script>
