<!DOCTYPE html>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/neat.css">
<link rel="stylesheet" href="/css/sync-styles.css">
<body class="panel-mode">
<div id="container">
    <div id="clipboardcopier">
        <textarea id="copier-input" value=""></textarea>
    </div>
    <div id="search" role="search"><div id="search-field"><svg class="vbm-icon vbm-icon-search" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.7" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10.3" y1="10.3" x2="13.6" y2="13.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="search-input" type="search" results="0" autofocus><button id="search-clear" type="button" tabindex="-1"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div><button id="quick-add-btn" type="button"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.7l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button><button id="tool-btn" type="button" title="Tools"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="13" cy="8" r="1.5" fill="currentColor"/></svg></button><span id="quick-add-toast" role="status"></span></div>
    <div id="undo-toast" hidden><span id="undo-toast-text"></span><button id="undo-toast-button" type="button"></button></div>
      <div id="donation">
        <div id="donation-card">
            <svg id="donation-heart" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 14.4S1.6 10.5 1.6 6.2c0-2 1.6-3.6 3.5-3.6 1.1 0 2.2.6 2.9 1.5.7-.9 1.8-1.5 2.9-1.5 1.9 0 3.5 1.6 3.5 3.6 0 4.3-6.4 8.2-6.4 8.2z" fill="currentColor"/></svg>
            <div id="information-text">
                <p id="new-version-text"></p>
                <p id="v4-notice" hidden><span id="v4-notice-text"></span> <a id="v4-guide-link" href=""></a></p>
                <p id="donation-text"></p>
                <div id="donation-actions">
                    <button id="donation-go" type="button"></button>
                    <button id="donation-later" type="button"></button>
                    <button id="donation-never" type="button"></button>
                </div>
            </div>
        </div>
    </div>
    <div id="view-tabs" role="tablist"></div>
    <div id="views">
        <section id="view-tree" class="view" role="tabpanel" aria-labelledby="view-tab-tree"><div id="tree" tabindex="-1"></div></section>
        <section id="view-search" class="view" role="tabpanel" aria-labelledby="view-tab-search" hidden><div id="search-history-area"></div><div id="results" tabindex="-1"></div></section>
        <section id="view-recent" class="view" role="tabpanel" aria-labelledby="view-tab-recent" hidden><div id="recent-list" tabindex="-1"></div></section>
        <section id="view-stats" class="view" role="tabpanel" aria-labelledby="view-tab-stats" hidden><div id="stats-list" tabindex="-1"></div></section>
        <section id="view-dead" class="view" role="tabpanel" aria-labelledby="view-tab-dead" hidden><div id="dead-list" tabindex="-1"></div></section>
        <section id="view-dupes" class="view" role="tabpanel" aria-labelledby="view-tab-dupes" hidden><div id="dupes-list" tabindex="-1"></div></section>
    </div>
    <div id="view-announce" class="visually-hidden" aria-live="polite"></div>
</div>
<div id="drop-overlay"></div>
<div id="bookmark-clone"></div>
<menu id="bookmark-context-menu" type="context" role="menu" tabindex="-1">
    <div id="reveal-in-tree" class="menu-item" role="menuitem" tabindex="-1" style="display:none"></div>
    <hr id="reveal-in-tree-sep" style="display:none">
    <div id="dead-mark-toggle" class="menu-item" role="menuitem" tabindex="-1" style="display:none"></div>
    <div id="dupes-set-keeper" class="menu-item" role="menuitem" tabindex="-1" style="display:none"></div>
    <div id="bookmark-new-tab" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="bookmark-new-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="bookmark-new-incognito-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep7">
    <div id="bookmark-open-in-new-group" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="bookmark-open-in-new-group-setup" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="bookmark-open-in-existing-group" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep4">
    <div id="bookmark-edit" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="copy-title-and-url" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep5">
    <div id="add-bookmark-before-bookmark" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-bookmark-after-bookmark" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep1">
    <div id="add-folder-before-bookmark" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-folder-after-bookmark" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep2">
    <div id="add-separator" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep3">
    <div id="replace-url" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="bookmark-context-menu-sep6">
    <div id="bookmark-delete" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<menu id="folder-context-menu" type="context" role="menu" tabindex="-1">
    <div id="folder-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="open-bookmarks-in-group" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="open-bookmarks-in-group-setup" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="folder-open-in-existing-group" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="folder-new-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="folder-new-incognito-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="folder-context-menu-sep1">
    <div id="folder-edit" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="folder-context-menu-sep7">
    <div id="sort-folder-by-name" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="sort-folder-by-date" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="sort-folder-contents" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="folder-context-menu-sep2">
    <div id="add-bookmark-top" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-bookmark-bottom" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-new-folder" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="folder-context-menu-sep3">
    <div id="add-bookmark-before-folder" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-bookmark-after-folder" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-folder-before-folder" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-folder-after-folder" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="add-folder-separator" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="folder-context-menu-sep4">
    <div id="folder-delete" class="menu-item" role="menuitem" tabindex="-1"></div>
    <!--<hr>
	<command id="copy-all-titles-and-urls" tabindex="-1">-->
</menu>
<menu id="separator-context-menu" type="context" role="menu" tabindex="-1">
    <div id="remove-separator" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<menu id="search-history-context-menu" type="context" role="menu" tabindex="-1">
    <div id="search-history-menu-rerun" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="search-history-menu-sep1">
    <div id="search-history-menu-remove" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="search-history-menu-clear" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<menu id="hist-row-context-menu" type="context" role="menu" tabindex="-1">
    <div id="hist-open-new-tab" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="hist-open-new-window" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="hist-open-incognito" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="hist-row-menu-sep1">
    <div id="hist-add-bookmark" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<menu id="dupes-group-context-menu" type="context" role="menu" tabindex="-1">
    <div id="dupes-group-clean" class="menu-item" role="menuitem" tabindex="-1"></div>
    <hr id="dupes-group-menu-sep1">
    <div id="dupes-group-toggle" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<menu id="palette-cmd-context-menu" type="context" role="menu" tabindex="-1">
    <div id="palette-cmd-edit" class="menu-item" role="menuitem" tabindex="-1"></div>
    <div id="palette-cmd-delete" class="menu-item" role="menuitem" tabindex="-1"></div>
</menu>
<div id="resizer-x" class="resizer"></div>
<div id="resizer-y" class="resizer"></div>
<div id="cover"></div>
<div id="command-palette" hidden><div class="palette-field"><input id="palette-input" type="text"><button id="palette-clear" type="button" tabindex="-1"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div><ul id="palette-results"></ul><button id="palette-close" type="button" tabindex="-1"><span class="palette-close-label"></span><kbd>Esc</kbd></button></div>
<div id="alert-dialog" class="dialog" role="dialog" aria-modal="true">
    <p id="alert-dialog-text" class="dialog-text"></p>
</div>
<div id="confirm-dialog" class="dialog" role="dialog" aria-modal="true">
    <p id="confirm-dialog-text" class="dialog-text"></p>
    <div class="buttons">
        <button id="confirm-dialog-button-1"></button>
        <button id="confirm-dialog-button-2"></button>
    </div>
</div>
<div id="edit-dialog" class="dialog" role="dialog" aria-modal="true">
    <form id="edit-dialog-form">
        <p id="edit-dialog-text" class="dialog-text"></p>
        <input id="edit-dialog-name">
        <input type="url" id="edit-dialog-url" aria-required="true" required>
        <div class="buttons">
            <button id="edit-dialog-button" type="submit"></button>
            <button id="edit-dialog-cancel-button" type="button"></button>
        </div>
    </form>
</div>
<div id="new-folder-dialog" class="dialog" role="dialog" aria-modal="true">
    <form id="new-folder-dialog-form">
        <p id="new-folder-dialog-text" class="dialog-text"></p>
        <input id="new-folder-dialog-name">
        <div class="buttons">
            <button id="new-folder-dialog-button" type="submit"></button>
            <button id="new-folder-dialog-cancel-button" type="button"></button>
        </div>
    </form>
</div>
<div id="sort-dialog" class="dialog" role="dialog" aria-modal="true">
    <p id="sort-dialog-text" class="dialog-text"></p>
    <div id="sort-dialog-options">
        <label><input type="radio" name="sort-by" id="sort-by-title" value="title" checked> <span id="sort-by-title-label"></span></label>
        <label><input type="radio" name="sort-by" id="sort-by-date" value="dateAdded"> <span id="sort-by-date-label"></span></label>
        <label><input type="checkbox" id="sort-folders-first" checked> <span id="sort-folders-first-label"></span></label>
        <label><input type="checkbox" id="sort-recursive"> <span id="sort-recursive-label"></span></label>
        <p id="sort-recursive-warning" hidden></p>
    </div>
    <div class="buttons">
        <button id="sort-dialog-ok-button" type="button"></button>
        <button id="sort-dialog-cancel-button" type="button"></button>
    </div>
</div>
<div id="tab-group-dialog" class="dialog" role="dialog" aria-modal="true">
    <p id="tab-group-dialog-text" class="dialog-text"></p>
    <label id="tab-group-title-label" for="tab-group-name"></label>
    <input id="tab-group-name">
    <span id="tab-group-color-label"></span>
    <div id="tab-group-colors" role="radiogroup">
        <label class="tab-group-color tg-grey"><input type="radio" name="tab-group-color" value="grey" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-blue"><input type="radio" name="tab-group-color" value="blue" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-red"><input type="radio" name="tab-group-color" value="red" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-yellow"><input type="radio" name="tab-group-color" value="yellow" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-green"><input type="radio" name="tab-group-color" value="green" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-pink"><input type="radio" name="tab-group-color" value="pink" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-purple"><input type="radio" name="tab-group-color" value="purple" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-cyan"><input type="radio" name="tab-group-color" value="cyan" class="visually-hidden"><span></span></label>
        <label class="tab-group-color tg-orange"><input type="radio" name="tab-group-color" value="orange" class="visually-hidden"><span></span></label>
    </div>
    <div class="buttons">
        <button id="tab-group-dialog-button" type="button"></button>
        <button id="tab-group-dialog-cancel-button" type="button"></button>
    </div>
</div>
<div id="tab-group-pick-dialog" class="dialog" role="dialog" aria-modal="true">
    <p id="tab-group-pick-text" class="dialog-text"></p>
    <ul id="tab-group-pick-list"></ul>
    <div class="buttons">
        <button id="tab-group-pick-cancel-button" type="button"></button>
    </div>
</div>
</body>

<script src="/src/popup.js"></script>
<script src="/src/sync-manager.js"></script>
